<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Center</title>
  <style>
    :root{--bg:#f5f3ee;--card:#fcfbf8;--line:#ddd8cf;--text:#1f1b16;--muted:#6e6860;--brand:#0d7b83;--brand2:#095d66;--accent:#d9a441;--shadow:0 10px 30px rgba(0,0,0,.06)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1400px;margin:0 auto;padding:20px 18px 34px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
    .title{display:flex;flex-direction:column;gap:4px}.title h1{margin:0;font-size:28px;line-height:1}.title p{margin:0;color:var(--muted);font-size:14px}
    .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 14px;font-weight:700;cursor:pointer}
    .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)} .btn.primary:hover{background:var(--brand2)}
    .datebar{margin:18px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
    .date-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.date-nav .nav{width:42px;padding:0;font-size:18px}
    .date-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:800;min-width:170px;text-align:center}
    .days{display:flex;gap:10px;overflow:auto;padding-bottom:4px;flex:1}
    .day{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;min-width:74px;text-align:center;cursor:pointer}
    .day strong{display:block;font-size:16px}.day span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.day.active{background:var(--brand);border-color:var(--brand);color:#fff}.day.active span{color:#e3ffff}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
    .list{display:flex;flex-direction:column;gap:14px}
    .section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px}.section-head h2{margin:0;font-size:18px}.section-head small{color:var(--muted)}
    .match{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 14px 12px;cursor:pointer;transition:.16s transform,.16s box-shadow,.16s border-color;display:grid;gap:10px}.match:hover{transform:translateY(-1px);border-color:#bfb8ad;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .row1{display:flex;justify-content:space-between;gap:12px;align-items:center}.comp{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}.status{font-size:12px;font-weight:800;color:var(--muted)}
    .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.team{font-size:18px;font-weight:800;line-height:1.1}.home{text-align:left}.away{text-align:right}.vs{font-size:12px;color:var(--muted);font-weight:800}
    .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}.score{font-size:22px;font-weight:900;min-width:54px;text-align:center;color:#111}
    .empty{padding:60px 20px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;color:var(--muted);box-shadow:var(--shadow)}
    .side{position:sticky;top:16px}.detail{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
    .detail h3{margin:0 0 4px;font-size:18px}.detail .sub{color:var(--muted);font-size:13px;margin-bottom:14px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.kv span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.kv strong{font-size:15px}
    .detail-box{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px}.detail-box h4{margin:0 0 10px;font-size:15px}.bar{height:10px;border-radius:999px;background:#eee;overflow:hidden;border:1px solid var(--line)}.fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));width:0%}
    .detail-score{display:flex;justify-content:center;align-items:center;gap:14px;margin:10px 0 12px}.detail-score .s{font-size:30px;font-weight:900}.muted{color:var(--muted)}
    @media (max-width:1100px){.layout{grid-template-columns:1fr}.side{position:static}}
    @media (max-width:700px){.top,.datebar{flex-direction:column;align-items:stretch}.date-nav{justify-content:space-between}.teams{grid-template-columns:1fr}.away{text-align:left}.score{justify-self:start;text-align:left}.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="title">
        <h1>Match Center</h1>
        <p>Partidos del día, navegación por fechas y detalle del encuentro.</p>
      </div>
      <div class="top-actions">
        <select id="competitionFilter" class="btn" style="min-width:220px"></select>
        <button class="btn primary" id="reloadBtn">Recargar</button>
      </div>
    </header>

    <div class="datebar">
      <div class="date-nav">
        <button class="btn nav" id="prevDay">‹</button>
        <div class="date-pill" id="selectedDate">--</div>
        <button class="btn nav" id="nextDay">›</button>
      </div>
      <div class="days" id="daysStrip"></div>
    </div>

    <div class="layout">
      <main class="list">
        <section class="section">
          <div class="section-head">
            <div>
              <h2 id="dayTitle">Partidos</h2>
              <small id="daySubtitle">Cargando...</small>
            </div>
            <small id="countInfo"></small>
          </div>
          <div id="matchesList" class="empty">Cargando partidos...</div>
        </section>
      </main>

      <aside class="side">
        <section class="detail" id="detailBox">
          <h3>Detalle del partido</h3>
          <div class="sub">Pulsa un partido para ver su información.</div>
          <div class="empty" style="padding:24px 14px;margin:0;box-shadow:none;">Sin partido seleccionado</div>
        </section>
      </aside>
    </div>
  </div>

  <script>
    const state = { date: new Date(), matches: [], allCompetition: '', competitions: [] };
    const $ = (id) => document.getElementById(id);

    const fmtDate = d => new Date(d).toLocaleDateString('es-ES', { weekday:'short', day:'2-digit', month:'short' });
    const iso = d => new Date(d).toISOString().slice(0,10);
    const esc = s => String(s ?? '').replace(/[&<>\"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));

    function aroundDays(center){
      const arr=[];
      for(let i=-3;i<=3;i++){const d=new Date(center); d.setDate(d.getDate()+i); arr.push(d);}
      return arr;
    }

    function renderDays(){
      const days = aroundDays(state.date);
      $('daysStrip').innerHTML = days.map(d => `
        <button class="day ${iso(d)===iso(state.date)?'active':''}" data-date="${iso(d)}">
          <strong>${d.getDate()}</strong>
          <span>${d.toLocaleDateString('es-ES',{month:'short'}).replace('.','')}</span>
        </button>
      `).join('');

      document.querySelectorAll('.day').forEach(btn => {
        btn.addEventListener('click', () => {
          state.date = new Date(btn.dataset.date + 'T12:00:00');
          renderDays();
          loadMatches();
        });
      });

      $('selectedDate').textContent = fmtDate(state.date);
    }

    async function loadCompetitions(){
      try{
        const res = await fetch('/api/competitions');
        state.competitions = res.ok ? await res.json() : [];
        $('competitionFilter').innerHTML =
          `<option value="">Todas las competiciones</option>` +
          state.competitions.map(c => `<option value="${esc(c.key)}">${esc(c.name)}</option>`).join('');
      }catch(e){
        $('competitionFilter').innerHTML = `<option value="">Todas las competiciones</option>`;
      }

      $('competitionFilter').addEventListener('change', () => {
        state.allCompetition = $('competitionFilter').value;
        loadMatches();
      });
    }

    function groupByCompetition(rows){
      const map = new Map();
      for(const m of rows){
        const k = m.competition_name || m.competition_key || 'Sin competición';
        if(!map.has(k)) map.set(k, []);
        map.get(k).push(m);
      }
      return [...map.entries()];
    }

    function renderMatches(rows){
      $('countInfo').textContent = `${rows.length} partidos`;

      if(!rows.length){
        $('matchesList').className = 'empty';
        $('matchesList').innerHTML = `No hay partidos para este día.`;
        return;
      }

      $('matchesList').className = 'list';
      $('matchesList').innerHTML = groupByCompetition(rows).map(([comp, items]) => `
        <section class="section">
          <div class="section-head">
            <div><h2>${esc(comp)}</h2><small>${items.length} partido${items.length===1?'':'s'}</small></div>
          </div>
          <div style="display:grid;gap:12px;">
            ${items.map(m => cardHtml(m)).join('')}
          </div>
        </section>
      `).join('');

      document.querySelectorAll('[data-match]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-match');
          const match = rows.find(x => String(x.id) === String(id));
          if(match) renderDetail(match);
        });
      });
    }

    function cardHtml(m){
      const time = m.kickoff_time ? String(m.kickoff_time).slice(0,5) : '--:--';
      const score = (m.home_goals ?? null) !== null && (m.away_goals ?? null) !== null ? `${m.home_goals}-${m.away_goals}` : 'vs';
      const tags = [];
      if (m.home_corners != null || m.away_corners != null) tags.push(`Corners ${(Number(m.home_corners||0)+Number(m.away_corners||0))}`);
      if (m.home_yellow_cards != null || m.away_yellow_cards != null) tags.push(`Tarjetas ${(Number(m.home_yellow_cards||0)+Number(m.away_yellow_cards||0)+Number(m.home_red_cards||0)+Number(m.away_red_cards||0))}`);
      if (m.market_goals) tags.push(`Pick goles ${m.market_goals}`);

      return `
        <article class="match" data-match="${esc(m.id)}">
          <div class="row1">
            <div class="comp">${esc(m.competition_key || '')}</div>
            <div class="status">${esc(time)} · ${esc(m.status || 'scheduled')}</div>
          </div>
          <div class="teams">
            <div class="team home">${esc(m.home_team)}</div>
            <div class="score">${esc(score)}</div>
            <div class="team away">${esc(m.away_team)}</div>
          </div>
          <div class="meta">
            <span>${esc(m.match_date)}</span>
            <span>${tags.join(' · ') || 'Sin métricas adicionales'}</span>
          </div>
        </article>
      `;
    }

    function renderDetail(m){
      const totalGoals = Number(m.home_goals||0)+Number(m.away_goals||0);
      const totalCorners = Number(m.home_corners||0)+Number(m.away_corners||0);
      const totalCards = Number(m.home_yellow_cards||0)+Number(m.away_yellow_cards||0)+Number(m.home_red_cards||0)+Number(m.away_red_cards||0);

      $('detailBox').innerHTML = `
        <h3>${esc(m.home_team)} vs ${esc(m.away_team)}</h3>
        <div class="sub">${esc(m.competition_name)} · ${esc(m.match_date)} · ${esc(m.kickoff_time || '--:--')}</div>
        <div class="detail-score">
          <span class="s">${esc(m.home_goals ?? '-')}</span>
          <span class="muted">-</span>
          <span class="s">${esc(m.away_goals ?? '-')}</span>
        </div>
        <div class="detail-grid">
          <div class="kv"><span>Estado</span><strong>${esc(m.status || '-')}</strong></div>
          <div class="kv"><span>Comp.</span><strong>${esc(m.competition_key || '-')}</strong></div>
          <div class="kv"><span>Corners</span><strong>${totalCorners}</strong></div>
          <div class="kv"><span>Tarjetas</span><strong>${totalCards}</strong></div>
          <div class="kv"><span>Goles totales</span><strong>${totalGoals}</strong></div>
          <div class="kv"><span>Predicción</span><strong>${esc(m.market_goals || 'N/D')}</strong></div>
        </div>
        <div class="detail-box">
          <h4>Confianza</h4>
          <div class="muted" style="margin-bottom:8px">
            Goles ${esc(m.confidence_goals ?? 'N/D')} · Corners ${esc(m.confidence_corners ?? 'N/D')} · Tarjetas ${esc(m.confidence_cards ?? 'N/D')}
          </div>
          <div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(m.confidence_goals||0)))}%"></div></div>
        </div>
      `;
    }

    async function loadMatches(){
      $('matchesList').innerHTML = '<div class="empty">Cargando partidos...</div>';
      const qs = new URLSearchParams({ date: iso(state.date) });
      if(state.allCompetition) qs.set('competition', state.allCompetition);

      try{
        const res = await fetch('/api/matches?' + qs.toString());
        const rows = res.ok ? await res.json() : [];
        state.matches = rows;
        $('dayTitle').textContent = `Partidos de ${fmtDate(state.date)}`;
        $('daySubtitle').textContent = state.allCompetition ? `Filtrado por ${state.allCompetition}` : 'Todas las competiciones';
        renderMatches(rows);
        if(rows[0]) renderDetail(rows[0]);
      }catch(e){
        $('matchesList').innerHTML = '<div class="empty">No se pudieron cargar los partidos.</div>';
      }
    }

    $('prevDay').onclick = () => { state.date.setDate(state.date.getDate()-1); renderDays(); loadMatches(); };
    $('nextDay').onclick = () => { state.date.setDate(state.date.getDate()+1); renderDays(); loadMatches(); };
    $('reloadBtn').onclick = () => loadMatches();

    renderDays();
    loadCompetitions().then(loadMatches);
  </script>
</body>
</html>
